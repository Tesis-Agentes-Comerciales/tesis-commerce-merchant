name: Validate merchant ACP/D17

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merchant-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: tesis_dev
          POSTGRES_PASSWORD: tesis_local_only
          POSTGRES_DB: tesis_lab
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U tesis_dev -d tesis_lab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://tesis_dev:tesis_local_only@127.0.0.1:55433/tesis_lab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install Python and locked dependencies
        run: |
          uv python install
          uv sync --frozen --all-groups

      - name: Migrate disposable PostgreSQL for API authentication tests
        run: uv run python -m commerce_lab.db migrate

      - name: Verify Python code and contracts (without PostgreSQL opt-in)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest
          uv build
